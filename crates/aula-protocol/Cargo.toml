[package]
name = "aula-protocol"
description = "Native AULA keyboard HID protocol and cross-brand OpenRGB SDK client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hidapi.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies.serde]
workspace = true

[dev-dependencies.serde_json]
workspace = true
